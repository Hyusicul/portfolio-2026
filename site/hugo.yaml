# projects
  projects:
    enable: true
    title: "개발 프로젝트"
    items:
      - title: "PeachScope - 복숭아 품질 예측 앱"
        content: "개발 기간: 2026.09.21 ~ 현재 (진행 중). 농가에서 복숭아의 수확 시기와 품질을 경험에 의존해 판단하는 문제를 보완하기 위한 스마트팜 팀 프로젝트입니다. 별도의 고가 측정 장비 없이 스마트폰으로 과실을 촬영하고 분석하는 서비스를 목표로 합니다. 저는 Kotlin 기반 Android 앱 개발과 서버 연동을 담당했습니다. 10×10cm 흰색 기준 종이를 탐지하여 과실의 가로·세로 크기를 추정하고, 과실 영역의 평균 RGB와 붉은색 비율을 계산하는 기능을 구현했습니다. 촬영 이미지를 FastAPI 기반 AI 모델 서버로 전달하고 당도·경도 예측 결과를 앱에 표시하도록 연동했습니다. 촬영 환경에 따른 색상 차이, 손이나 배경의 오검출, 서버 응답 지연 등의 문제를 경험했으며, 현재 인식 정확도와 서비스 안정성을 개선하고 있습니다. RGB만으로 내부 품질을 정확히 예측할 수 있는지는 추가적인 모델 검증이 필요한 단계입니다."
        image: "images/peachscope.png"
        featured:
          name: "PeachScope PDF 보기"
          link: "https://hyusicul.github.io/portfolio-2026/viewers/peachscope.html"
        badges:
          - "Kotlin"
          - "Android"
          - "Python"
          - "FastAPI"
          - "Smart Farm"
          - "AI"

      - title: "Blue Chat - 채팅 애플리케이션"
        content: "개발 기간: 2026.05.27 ~ 2026.06.21 (완료). Android Studio와 Kotlin으로 개발한 실시간 채팅 애플리케이션입니다. Firebase Authentication을 이용해 이메일·비밀번호 기반 사용자 인증을 구현하고, Cloud Firestore를 통해 친구 관리와 실시간 메시지 동기화를 처리했습니다. 1:1 채팅, 오픈채팅, 비밀채팅, 메시지 검색, 사용자 차단, 사진 전송 등의 기능을 구현했습니다. 이미지 파일은 Cloudinary에 저장하고 Firestore에는 이미지 URL을 기록하여 데이터 저장 역할을 분리했습니다. 개발 중 기기별 메시지 순서가 달라지는 문제를 서버 타임스탬프 적용으로 개선했습니다. 향후 푸시 알림과 채팅 보안, 일부 화면의 실시간 갱신 기능을 보완할 계획입니다."
        image: "images/bluechat.png"
        featured:
          name: "Blue Chat PDF 보기"
          link: "https://hyusicul.github.io/portfolio-2026/viewers/bluechat.html"
        badges:
          - "Application"
          - "Chat"
          - "UI/UX"

