baseURL: "https://hyusicul.github.io/portfolio-2026/"
languageCode: "ko-KR"
title: "박현 Portfolio"


# Korean language configuration
defaultContentLanguage: "ko"
defaultContentLanguageInSubdir: false
languages:
  ko:
    languageName: "한국어"
    weight: 1
    contentDir: "content"


outputs:
  home:
    - "HTML"
    - "RSS"
    - "JSON"
  page:
    - "HTML"
    - "RSS"

enableRobotsTXT: true

#services:
  #googleAnalytics:
    #id: G-MEASUREMENT_ID
  #disqus:
    #shortname: your-disqus-shortname

pagination:
  pagerSize: 3

markup:
