baseURL: "https://hyusicul.github.io/portfolio-2026/"
languageCode: "ko-KR"
title: "박현 Portfolio"


# Korean language configuration
defaultContentLanguage: "ko"
defaultContentLanguageInSubdir: false
languages:
  ko:
    languageName: "한국어"
    weight: 1
    contentDir: "content"


outputs:
  home:
    - "HTML"
    - "RSS"
    - "JSON"
  page:
    - "HTML"
    - "RSS"

enableRobotsTXT: true

#services:
  #googleAnalytics:
    #id: G-MEASUREMENT_ID
  #disqus:
    #shortname: your-disqus-shortname

pagination:
  pagerSize: 3

markup:
  goldmark:
    renderer:
      unsafe: true

params:
  title: "박현 Portfolio"
  description: "전북대학교 스마트팜학과 박현의 스마트팜, 인공지능 및 웹·앱 개발 프로젝트 포트폴리오"
  # staticPath: ""  # The path to serve the static files from
  favicon: "images/favicon.png"

  # Whether to serve bootstrap css and js files from CDN or not. Can be set to true, "css" or "js" to choose between
  # serving both, only the css, or only the js files through the CDN. Any other value will make so that CDN is not used.
  # Note the lack of "" in true, it should be of boolean type.
  useBootstrapCDN: false

  # If you want to load dynamically responsive images from Cloudinary
  # This requires your images to be uploaded + hosted on Cloudinary
  # Uncomment and change YOUR_CLOUD_NAME to the Cloud Name in your Cloudinary console
  # cloudinary_cloud_name: "YOUR_CLOUD_NAME"

  # Whether to add mathjax support on all pages. Alternatively, you can opt-in per page by adding `mathjax: true` in the frontmatter.
  mathjax: false

  # Whether the fade animations on the home page will be enabled
  animate: true

  theme:
    # disableThemeToggle: true
    # defaultTheme: "light" # dark

  font:
    fontSize: 1rem # default: 1rem
    fontWeight: 400 # default: 400
    lineHeight: 1.5 # default: 1.5
    textAlign: left # default: left

  # color preference
  # When using hex codes for colors, quotations must be used along with the # sign
  # color:
  #   textColor: "#343a40"
  #   secondaryTextColor: "#6c757d"
  #   textLinkColor: "#007bff"
  #   backgroundColor: "#eaedf0"
  #   secondaryBackgroundColor: "#64ffda1a"
  #   primaryColor: "#007bff"
  #   secondaryColor: "#f8f9fa"

  #   darkmode:
  #     textColor: "#e4e6eb"
  #     secondaryTextColor: "#b0b3b8"
  #     textLinkColor: "#ffffff"
  #     backgroundColor: "#18191a"
  #     secondaryBackgroundColor: "#212529"
  #     primaryColor: "#ffffff"
  #     secondaryColor: "#212529"

  # If you want to customize the menu, you can change it here
  navbar:
    align: ms-auto # Left: ms-auto | center: mx-auto | right: me-auto | Default: ms-auto
    # brandLogo: "/logo.png" # Logo for the brand | default is the favicon variable
    showBrandLogo: false # Show brand logo in nav bar | default is true
    brandName: "박현 Portfolio" # Brand name for the brand | default is the title variable
    disableSearch: true
    # searchPlaceholder: "Search"
    stickyNavBar:
      enable : true
      showOnScrollUp : true
    enableSeparator: false
    menus:
      disableAbout: false
      disableExperience: false
      disableEducation: false
      disableProjects: false
      disableAchievements: false
      disableContact: true

  # Hero
  hero:
    enable: true
    intro: "안녕하세요, 저는"
    title: "박현(朴賢)입니다."
    subtitle: "스마트팜 × AI × 웹·앱 개발"
    content: "전북대학교 스마트팜학과에 재학 중이며 컴퓨터인공지능학부 인공지능학과 복수전공을 이수 중입니다. 디지털 농업 AI 트랙을 이수했으며, 농업 현장의 문제를 인공지능과 소프트웨어로 해결하는 기술에 관심이 있습니다."
    image: "images/park-hyun-profile.png"
    bottomImage:
      enable: true
    # roundImage: true # Make hero image circular | default false
    button:
      enable: false

    socialLinks:
      fontAwesomeIcons:
        - icon: fab fa-github
          url: "https://github.com/Hyusicul"
      customIcons: []

  # About
  about:
    enable: true
    title: "자기소개"
    image: "images/park-hyun-profile.png"
    content: |-
      안녕하세요. 전북대학교 스마트팜학과에 재학 중이며,
      컴퓨터인공지능학부 인공지능학과를 복수전공하고 있는 박현입니다.

      전북대학교 디지털 농업 AI 트랙을 이수했으며,
      스마트팜과 인공지능을 결합한 기술에 관심이 있습니다.

      **관심 분야**

      농업 현장에서 발생하는 문제를 소프트웨어와 인공지능으로
      해결하는 기술에 관심이 있습니다. 특히 과실 품질 분석과
      스마트폰 기반 농업 서비스 개발에 흥미를 가지고 있습니다.

      **학습 목표**

      AI 모델과 웹·앱 서비스를 안정적으로 연결하여
      실제 농업 현장에서 활용할 수 있는 서비스를 개발하는 것이 목표입니다.

      **앞으로의 계획**

      PeachScope 프로젝트를 발전시키면서 이미지 분석 정확도를 개선하고,
      Android 앱과 서버 및 데이터베이스 연동 기술을 학습하겠습니다.

    skills:
      enable: true
      title: "학습 및 활용 기술"
      items:
        - "Python"
        - "Kotlin"
        - "HTML / CSS / JavaScript"
        - "Vue"
        - "FastAPI"
        - "Firebase"
        - "Git / GitHub"
        - "GitHub Actions"


# Experience
  experience:
    enable: true
    title: "학교생활 및 활동"
    items:
      - company: "전북대학교 스마트팜학과 (JBNU)"
        companyUrl: "https://www.jbnu.ac.kr/"
        jobs:
          - name: "제1대 학생회 홍보국원"
            content: "전북대학교 스마트팜학과 제1대 학생회 홍보국원으로 활동하며 학과 홍보 관련 업무를 경험했습니다."

          - name: "제4대 학생회 홍보국원"
            content: "전북대학교 스마트팜학과 제4대 학생회 홍보국원으로 활동하며 학과 구성원을 위한 홍보 활동에 참여했습니다."
# Education
  education:
    enable: true
    title: "학력 및 교육"
    index: false
    items:
      - title: "스마트팜학과 · 인공지능학과 복수전공"
        school:
          name: "전북대학교"
        date: "재학 중"
        content: |-
          - 주전공: 스마트팜학과
          - 복수전공: 컴퓨터인공지능학부 인공지능학과
          - 스마트팜과 인공지능을 결합한 기술을 학습하고 있습니다.

      - title: "디지털 농업 AI 트랙"
        school:
          name: "전북대학교"
        date: "이수 완료"
        content: "디지털 농업과 인공지능 융합 교육과정을 이수했습니다."

      - title: "고등학교 졸업"
        school:
          name: "전주영생고등학교"
        date: "2022년 2월 졸업"

      - title: "중학교 졸업"
        school:
          name: "전주풍남중학교"
        date: "2019년 2월 졸업"

      - title: "초등학교 졸업"
        school:
          name: "전주삼천남초등학교"
        date: "2016년 2월 졸업"

# Achievements
  achievements:
    enable: true
    title: "활동 이력 및 자격"
    items:
      - title: "대한민국 육군 병장 만기전역"
        content: "대한민국 육군 제15보병사단에서 군 복무를 마치고 병장으로 만기전역했습니다."

      - title: "운전면허 1종 보통"
        content: "자동차운전면허 제1종 보통을 보유하고 있습니다."

# projects
  projects:
    enable: true
    title: "개발 프로젝트"
    items:
      - title: "PeachScope - 복숭아 품질 예측 앱"
        content: "개발 기간: 2026.09.21 ~ 현재 (진행 중). 복숭아의 외형 정보를 스마트폰 촬영으로 분석하고 당도·경도 예측을 지원하는 스마트팜 팀 프로젝트입니다. Kotlin Android 앱과 FastAPI 모델 연동, 10×10cm 흰 종이 기준의 크기 추정, RGB 분석 및 결과 화면 구현을 담당했습니다. 촬영 환경에 따른 인식 오차와 AI 모델의 예측 정확도 검증은 향후 개선 과제입니다."
        image: "images/peachscope.png"
        featured:
          name: "PeachScope PDF 보기"
          link: "https://hyusicul.github.io/portfolio-2026/viewers/peachscope.html"
        badges:
          - "Kotlin"
          - "Android"
          - "Python"
          - "FastAPI"
          - "Smart Farm"
          - "AI"

      - title: "Blue Chat - 채팅 애플리케이션"
        content: "개발 기간: 2026.05.27 ~ 2026.06.21 (완료). Kotlin Android로 구현한 실시간 채팅 앱입니다. Firebase Authentication·Firestore를 이용해 로그인, 친구 관리, 1:1·오픈·비밀 채팅과 실시간 메시지를 구현했습니다. Cloudinary에 이미지를 저장하고 Firestore에 URL을 기록해 사진 공유를 구현했으며, 서버 타임스탬프로 메시지 순서를 관리했습니다. 알림 및 보안 개선이 향후 과제입니다."
        image: "images/bluechat.png"
        featured:
          name: "Blue Chat PDF 보기"
          link: "https://hyusicul.github.io/portfolio-2026/viewers/bluechat.html"
        badges:
          - "Application"
          - "Chat"
          - "UI/UX"

  # Contact - disabled
  contact:
    enable: false

  footer:
    recentPosts:
      enable: false
    socialNetworks:
      github: "https://github.com/Hyusicul"


  # List pages like blogs and posts
  listPages:
    disableFeaturedImage: false

  # Single pages like blog and post
  singlePages:
    socialShare: true
    readTime:
      enable: true
      content: "min read"
    scrollprogress:
      enable: true
    tags:
      openInNewTab: true

  # For translations
  terms:
    read: "Read"
    toc: "Table Of Contents"
    copyright: "All rights reserved"
    emailText: "Check out this site"

  datesFormat:
    article: "Jan 2, 2006"
    articleList: "Jan 2, 2006"
    articleRecent: "Jan 2, 2006"

  #customScripts: -| # You can add custom scripts which will be added before </body> tag
  #  <script type="text/javascript"><!-- any script here --></script>
